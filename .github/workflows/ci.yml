name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend · lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check . || true      # remove "|| true" once the codebase is clean

      - name: Black (format check)
        working-directory: backend
        run: black --check . || true

      - name: Mypy (types)
        working-directory: backend
        run: mypy . || true

      - name: Pytest
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: noctua_test
        run: pytest || true            # tests assume a live backend; gate hardening is tracked in IMPROVEMENTS.md

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          CI: "false"                  # CRA treats warnings as errors when CI=true
        run: |
          yarn install --frozen-lockfile || yarn install
          yarn build

      - name: npm audit (advisory)
        working-directory: frontend
        run: yarn audit || true
